# Alembic 迁移配置（教程第 03 章 2.6 节）
[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# 真实 URL 在 migrations/env.py 里从 app.core.config.settings 覆盖
sqlalchemy.url = sqlite:///./mathteam.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
